<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b59c3">
  <title>오답노트</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header id="topbar"><h1 id="title">오답노트</h1><button id="helpBtn" class="help-btn" aria-label="사용 설명서" hidden>❓ 사용법</button><div id="testbar" hidden></div></header>

  <main>
    <section id="screen-home" class="screen"></section>
    <section id="screen-help" class="screen" hidden></section>
    <section id="screen-review" class="screen" hidden></section>
    <section id="screen-graduated" class="screen" hidden></section>
    <section id="screen-add" class="screen" hidden></section>
    <section id="screen-list" class="screen" hidden></section>
    <section id="screen-detail" class="screen" hidden></section>
    <section id="screen-edit" class="screen" hidden></section>
    <section id="screen-stats" class="screen" hidden></section>
    <section id="screen-settings" class="screen" hidden></section>
  </main>

  <nav id="tabbar">
    <button data-go="home"><span class="ic">🏠</span>홈</button>
    <button data-go="add"><span class="ic">➕</span>등록</button>
    <button data-go="list"><span class="ic">📋</span>목록</button>
    <button data-go="stats"><span class="ic">📊</span>통계</button>
    <button data-go="settings"><span class="ic">⚙️</span>설정</button>
  </nav>

  <div id="toast" role="status"></div>
</body>
</html>
